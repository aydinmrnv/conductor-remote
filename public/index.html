<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0d10" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>Conductor Remote</title>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<header class="topbar">
			<button id="back" class="back hidden" aria-label="Back">‹</button>
			<div class="title" id="title">Workspaces</div>
			<div class="conn" id="conn" title="connection"></div>
		</header>

		<main id="view"></main>

		<div id="composer" class="composer hidden">
			<textarea id="prompt" rows="1" placeholder="Send a prompt…" autocomplete="off"></textarea>
			<button id="send" aria-label="Send">↑</button>
		</div>

		<script type="module" src="/app.js"></script>
	</body>
</html>
