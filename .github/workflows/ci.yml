name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # package.json pins yarn@4 via the packageManager field; corepack provides it.
      # The relay itself has zero runtime deps, but `verify` (tsc + biome) needs the
      # devDependency toolchain, so we install. Build scripts stay disabled (sharp's
      # native binary is only needed by gen:icons, not by typecheck/lint).
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify
