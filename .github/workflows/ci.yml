name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      # corepack (above) provides the pinned yarn@4. devDeps carry tsc + biome +
      # the Vite toolchain; the published package itself has zero runtime deps.
      # (Build scripts stay disabled — sharp's native binary is only for gen:icons.)
      - run: yarn install --immutable
      - run: yarn verify
      # Build here too: it's the only thing that exercises the React/PWA side,
      # and `prepack` runs the same build at publish time.
      - run: yarn build

  # The compile half of check:applescript needs osacompile, which only exists on
  # macOS — on ubuntu it skips, so a stray quote in src/conductor.applescript
  # would ship and surface for the first time as a failed send on someone's
  # phone. This job is what parses the script the way osascript will. It's kept
  # lean on purpose: the check script is stdlib-only and runs under plain node
  # (default type-stripping), so there is no corepack, no yarn install — a
  # checkout and node 24 are the whole cost of the macOS runner.
  check-applescript:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-applescript.ts

  # Conventional Commits gate, and the only one that actually runs. The husky
  # commit-msg hook is not a second line of defence: besides `--no-verify`, it is
  # simply *absent* from any clone that hasn't run `yarn install`, because husky
  # points core.hooksPath at .husky from a `prepare` script — so a fresh checkout
  # (a cloud agent's container, a CI-side clone) commits with no gate at all and
  # no warning that it had none.
  #
  # It lints two different strings because the repo squash-merges, and GitHub
  # picks the squash subject by commit count: a single-commit PR lands *that
  # commit's* subject, a multi-commit PR lands the *PR title*. Either one can be
  # the unparseable string, and checking only the commits misses half of that.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Branch commits
        if: github.event_name == 'pull_request'
        run: yarn commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      # The title is whatever the PR's author typed, so it rides in an env var —
      # interpolated straight into `run:` it would be a shell injection.
      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | yarn commitlint --verbose
      # The backstop for a red commitlint that got merged anyway. semantic-release
      # *ignores* a commit it can't parse, and "no relevant changes" is a silent
      # success — so main goes green, no tag is cut, and whatever that commit
      # carried never reaches npm or the relays that auto-update from it. This is
      # what makes an unreleasable main look unreleasable.
      - name: What landed on main
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A first push, or one over rewritten history, reports an all-zero
          # `before`; fall back to the tip's parent rather than linting the whole
          # history back to the root commit.
          from="$BEFORE"
          case "$from" in '' | 0000000000000000000000000000000000000000) from="$(git rev-parse "$AFTER^")" ;; esac
          yarn commitlint --from "$from" --to "$AFTER" --verbose

  release:
    # check-applescript gates the release too: the tarball ships the .applescript
    # verbatim, so publishing one that doesn't compile is the worst outcome here.
    needs: [check, check-applescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags + GitHub Releases
      issues: write # @semantic-release/github comments on released issues/PRs
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC) + provenance — no NPM_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      # No NPM_TOKEN: @semantic-release/npm exchanges the GitHub OIDC id-token for a
      # short-lived publish token (npm Trusted Publishing). Requires a trusted
      # publisher for this package on npmjs.com → repo hyldmo/conductor-remote,
      # workflow ci.yml. Provenance is generated automatically.
      - run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
