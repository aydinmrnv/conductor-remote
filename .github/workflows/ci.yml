name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Zero runtime deps — nothing to install. Syntax + type-strip check only;
      # the relay itself needs macOS + a running Conductor to exercise fully.
      - run: yarn verify
